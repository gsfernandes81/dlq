[project]
name = "dlq"
version = "0.2.0"
description = "The pre-midnight expiring-quota download queue and its nightly runner"
requires-python = ">=3.11"
# Deliberately empty. Everything here is stdlib; ytq and quota_widget are
# reached as sibling CHECKOUTS (~/ytq, ~/zwana-quota, or $YTQ_HOME /
# $ZWANA_HOME), never as installed packages, so installing this pulls nothing
# from the internet.
dependencies = []

[project.scripts]
# The queue's one command: the screen when called bare on a terminal, status
# off one, every verb, and `dlq <url>` — the plain-URL queue ask, uniform
# with `ytq <url>`. It resolves the queue root through ytq._root rather than
# trusting __file__, so an installed copy still manages the real queue.
dlq = "expire_sched:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat sibling modules, not a package: they import each other by bare name and
# the queue items written into queue/ do the same, so the whole directory has
# to land on sys.path as one unit.
only-include = [
    "dlq.py",
    "expire_dl.py",
    "expire_runner.py",
    "expire_sched.py",
    "expire_ui.py",
]
sources = ["."]
# Editable installs get a .pth for this directory instead of per-module
# shims, which keeps `import expire_dl` working the same way the runtime
# sys.path.insert calls already assume.
dev-mode-dirs = ["."]

# Two groups, not one — the or3 repo's uv plan (docs/uv-dev-env.md there),
# applied here. `uv sync` installs dev (pytest is pure Python and installs
# anywhere, the phone included); lint is separate because a plain sync must
# NOT drag ruff onto a machine that has it natively — Termux ships a native
# aarch64 ruff, and uv cannot install ruff on Android (neither manylinux nor
# musllinux). The pin is Termux's own version, so a lint count measured in
# the container describes what the phone will see.
[dependency-groups]
# pyte is a terminal emulator in pure Python, and it is here for one reason:
# the front ends ARE their screens, and the failures worth catching — a page
# that leaves when it should stay, a sentence clipped over the keys — are only
# visible on one. The suite opens the real screen on a pty and reads what a
# terminal would have shown. Pure Python, so it installs on the phone too.
dev = [
    "pyte>=0.8.2",
    "pytest>=8",
]
lint = ["ruff==0.16.4"]
