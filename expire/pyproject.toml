[project]
name = "or3-expire-queue"
version = "0.1.0"
description = "Queue tools for the pre-midnight expiring-quota download runner"
requires-python = ">=3.11"
# Deliberately empty. ytq shells out to the yt-dlp *binary* on PATH rather than
# importing it, and everything else here is stdlib, so installing this pulls
# nothing from the internet.
dependencies = []

[project.scripts]
ytq = "ytq:main"
dlq = "dlq:main"
# The queue's own management command: arm the nightly job, and ask what it is
# doing. It resolves the checkout the same way ytq does rather than trusting
# __file__, so an installed copy still manages the real queue.
dlqd = "expire_sched:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat sibling modules, not a package: they import each other by bare name and
# the queue items written into queue/ do the same, so the whole directory has
# to land on sys.path as one unit.
only-include = [
    "ytq.py",
    "dlq.py",
    "ytdl_item.py",
    "expire_dl.py",
    "expire_runner.py",
    "expire_sched.py",
    "expire_ui.py",
]
sources = ["."]
# Editable installs get a .pth for this directory instead of per-module
# shims, which keeps `import ytq` / `import expire_dl` working the same way
# the runtime sys.path.insert calls already assume.
dev-mode-dirs = ["."]
